[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dejitech-mockup"
version = "2.0.0"
description = "High-performance CLI tool for overlaying screen recordings onto device mockup frames with professional effects"
readme = "README.md"
license = "MIT"
authors = [
    { name = "DejiTech", email = "deji@dejitech.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
keywords = [
    "mockup",
    "video",
    "ffmpeg",
    "cli",
    "screen-recording",
    "device-frame",
    "content-creator",
    "social-media",
    "tiktok",
    "instagram",
    "youtube",
]

dependencies = [
    "typer[all]>=0.12.0",
    "ffmpeg-python>=0.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
watch = [
    "watchdog>=4.0.0",
]
upload = [
    "boto3>=1.34.0",
    "cloudinary>=1.40.0",
]
all = [
    "watchdog>=4.0.0",
    "boto3>=1.34.0",
    "cloudinary>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
dejitech-mockup = "dejitech_mockup.main:main"
dmockup = "dejitech_mockup.main:main"

[project.urls]
Homepage = "https://github.com/dejitech/dejitech-mockup"
Repository = "https://github.com/dejitech/dejitech-mockup"
Documentation = "https://github.com/dejitech/dejitech-mockup#readme"
Issues = "https://github.com/dejitech/dejitech-mockup/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dejitech_mockup"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dejitech_mockup"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/dejitech_mockup"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
